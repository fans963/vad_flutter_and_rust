name: vad
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  rust_lib_vad:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  flex_color_scheme: ^8.4.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  dynamic_color: ^1.8.1
  animations: ^2.2.0
  url_launcher: ^6.3.2
  auto_size_text: ^3.0.0
  file_selector: ^1.1.0
  syncfusion_flutter_charts: ^33.2.8
  flutter_colorpicker: ^1.1.0
  freezed_annotation: ^3.1.0
  show_fps: ^1.1.0
  signals: ^7.1.0
  super_drag_and_drop: ^0.9.1
  syncfusion_flutter_core: ^33.2.8

dev_dependencies:
  flutter_launcher_icons:
    git:
      url: https://github.com/devmil/flutter_launcher_icons.git
      ref: add_linux_support
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  assets:
    - assets/image/icon.png
    - assets/image/fan_avatar.png
    - assets/image/liu_avatar.jpg
